name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crescendo-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The hosted Ubuntu image already supplies the SDK and command-line tools.
      # Expose its path to the cache action, then install only on a cache miss.
      - name: Locate Android SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}" || { echo "::error::Android SDK is missing on the runner."; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.0
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-37.0-36.0.0-v1

      - name: Install missing Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          [[ -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]] || packages+=("platforms;android-37.0")
          [[ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]] || packages+=("build-tools;36.0.0")
          if (( ${#packages[@]} )); then
            manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [[ -x "$manager" ]] || { echo "::error::Android SDK manager is missing on the runner."; exit 1; }
            yes | "$manager" --licenses >/dev/null 2>&1 || true
            "$manager" "${packages[@]}"
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble and verify signed release APK
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.CRESCENDO_RELEASE_KEYSTORE_B64 }}
          CRESCENDO_RELEASE_PASSWORD: ${{ secrets.CRESCENDO_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY_B64" || -z "$CRESCENDO_RELEASE_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing. Refusing to upload an unsigned APK."
            exit 1
          fi
          umask 077
          export CRESCENDO_RELEASE_STORE_FILE="$RUNNER_TEMP/crescendo-release.p12"
          trap 'rm -f "$CRESCENDO_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$CRESCENDO_RELEASE_STORE_FILE"
          unset SIGNING_KEY_B64
          chmod +x ./gradlew
          if ! ./gradlew assembleRelease --no-daemon --parallel --build-cache 2>&1 | tee "$RUNNER_TEMP/crescendo-build.log"; then
            python3 .github/scripts/annotate-build.py "$RUNNER_TEMP/crescendo-build.log"
            exit 1
          fi
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$certs"
          if ! printf '%s\n' "$certs" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'; then
            echo "::error::The APK is missing a valid v2 signature."
            exit 1
          fi
          actual=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=8c09ad22a142204571120d2e47f4bf60dd67af0e2d2b7e4cc2e9462036347c1e
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Signing certificate differs from the previous Crescendo release."
            exit 1
          fi

      - name: Upload build log if assembly fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crescendo-build-log
          path: ${{ runner.temp }}/crescendo-build.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: crescendo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
