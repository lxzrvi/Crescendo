name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/crescendo-build.log"

      - name: Upload build log if assembly fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crescendo-build-log
          path: ${{ runner.temp }}/crescendo-build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crescendo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
