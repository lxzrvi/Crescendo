name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crescendo-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.0
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-37.0-36.0.0-v1

      - name: Install Android SDK components if missing
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble signed release APK
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.CRESCENDO_RELEASE_KEYSTORE_B64 }}
          CRESCENDO_RELEASE_PASSWORD: ${{ secrets.CRESCENDO_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY_B64" || -z "$CRESCENDO_RELEASE_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing. Refusing to upload an unsigned APK."
            exit 1
          fi
          umask 077
          export CRESCENDO_RELEASE_STORE_FILE="$RUNNER_TEMP/crescendo-release.p12"
          trap 'rm -f "$CRESCENDO_RELEASE_STORE_FILE"' EXIT
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$CRESCENDO_RELEASE_STORE_FILE"
          unset SIGNING_KEY_B64
          chmod +x ./gradlew
          if ! ./gradlew assembleRelease --no-daemon --parallel --build-cache 2>&1 | tee "$RUNNER_TEMP/crescendo-build.log"; then
            # Artifact uploads bypass GitHub's automatic log masking. Redact first.
            python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"crescendo-build.log"; s=os.environ["CRESCENDO_RELEASE_PASSWORD"]; p.write_text(p.read_text(errors="replace").replace(s,"[REDACTED]"))'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload build log if assembly fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crescendo-build-log
          path: ${{ runner.temp }}/crescendo-build.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: crescendo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
